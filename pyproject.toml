[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedora-postinstall-checklist"
version = "0.4.0"
description = "Interactive TUI checklist for setting up a fresh Fedora Linux install."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "kernastra" }]
license = { text = "MIT" }
keywords = ["fedora", "linux", "tui", "checklist", "post-install"]
classifiers = [
  "Environment :: Console :: Curses",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11"
]

[project.scripts]
fedora-checklist = "fedora_checklist.app:main"

[tool.setuptools]
packages = ["fedora_checklist"]
include-package-data = true

[tool.setuptools.package-data]
fedora_checklist = ["checklist.json"]
